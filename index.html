<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGrade — Ubah Nilai & Isi e-Rapor T/R</title>
  <meta name="description" content="EduGrade membantu guru mengubah nilai di file Excel sendiri dan mengisi T/R template e-Rapor secara otomatis. Data siswa diproses di komputer guru.">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="top"></header>
  <div class="stepper-bar hidden" id="stepper"></div>
  <main id="main"></main>
  <div id="bar"></div>
  <footer class="footer">
    <div class="footer-in">
      <div class="stack-xs">
        <p class="muted">Data nilai diproses di komputer Anda dan tidak dikirim ke server.</p>
        <p class="small muted">EduGrade bukan produk resmi Kemendikdasmen.</p>
      </div>
      <a id="waFoot" class="row b" style="gap:8px" target="_blank" rel="noopener" href="#">Butuh bantuan? Chat WhatsApp</a>
    </div>
  </footer>
  <noscript><div style="padding:24px;text-align:center">Aktifkan JavaScript untuk memakai EduGrade.</div></noscript>

  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Tautan WhatsApp di kaki halaman
    document.addEventListener('DOMContentLoaded', function () {
      var a = document.getElementById('waFoot');
      var upd = function () { var wa = (window.__RP && window.__RP.cfg && window.__RP.cfg.wa) || window.RP_CONFIG.WA_ADMIN; a.href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Halo Admin EduGrade, saya butuh bantuan.'); };
      upd(); setTimeout(upd, 4000);
    });
  </script>
</body>
</html>
